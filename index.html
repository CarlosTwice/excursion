<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excursion — Discover hidden places in the world around you</title>
  <link rel="stylesheet" href="./resources/css/style.css">
</head>
<body>

  <header class="section hero">
    <h1 class="hero-title">Discover hidden places in the world around you</h1>
    <a href="#" class="download-link">Download Excursion (Coming soon!)</a>

    <div class="phone-mockup">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="waterfall-visual" aria-label="Waterfall preview">
            <div class="wf-mist"></div>
            <div class="wf-stream wf-stream-1"></div>
            <div class="wf-stream wf-stream-2"></div>
            <div class="wf-stream wf-stream-3"></div>
            <div class="wf-rocks"></div>
          </div>
        </div>
        <div class="phone-home-button"></div>
      </div>
    </div>
  </header>

  <main class="section guide">
    <h2 class="guide-title">Your personal travel guide</h2>
    <p class="guide-subtitle">Excursion remembers places you like, and recommends new points of interest around you.</p>

    <div class="camp-visual" aria-label="Campsite at night">
      <div class="camp-sky"></div>
      <div class="camp-stars"></div>
      <div class="camp-horizon"></div>
      <div class="camp-glow"></div>
      <div class="tent tent-main">
        <div class="tent-body"></div>
        <div class="tent-cross"></div>
      </div>
      <div class="tent tent-side"></div>
    </div>
  </main>

  <footer class="section cta">
    <svg class="phone-icon" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="14" y="4" width="32" height="52" rx="4" stroke="white" stroke-width="2.5"/>
      <line x1="20" y1="40" x2="40" y2="26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <h2 class="cta-title">Coming Soon for iPhone and Android</h2>
    <a href="#" class="download-link">Download Excursion (Coming soon!)</a>

    <p class="copyright">© Excursion</p>
  </footer>

</body>
</html>
